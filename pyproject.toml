[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-mcp-server"
version = "0.1.0"
description = "MCP server for Robot Framework project analysis and source generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "PyYAML==6.0.2",
]

[project.scripts]
robotframework-mcp-server = "robotframework_mcp_server.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
